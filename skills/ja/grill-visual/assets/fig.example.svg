  <text x="364" y="192" font-size="13" font-weight="700" style="fill:var(--ink)">コメント</text>
</g>
<!-- C: 18時まで待って1通 -->
<g data-layer="C">
  <path d="M160 67C190 67 190 112 214 112M160 127H214M160 187C190 187 190 142 214 142" style="fill:none;stroke:var(--q);stroke-width:1.5"/>
  <rect x="214" y="98" width="82" height="58" rx="4" style="fill:var(--q-soft);stroke:var(--q);stroke-width:1.5"/>
  <circle cx="232" cy="127" r="10" style="fill:var(--surface);stroke:var(--q);stroke-width:1.5"/><path d="M232 121V127H237" style="fill:none;stroke:var(--q);stroke-width:1.5"/>
  <text x="248" y="124" font-size="12" font-weight="700" style="fill:var(--ink)">18:00</text><text x="248" y="141" font-size="12" style="fill:var(--ink)">まで待つ</text>
  <path d="M296 186H346" style="fill:none;stroke:var(--q);stroke-width:1.5;stroke-dasharray:4 4" marker-end="url(#fx-q)"/>
  <path d="M255 156V186H296" style="fill:none;stroke:var(--q);stroke-width:1.5;stroke-dasharray:4 4"/>
  <text x="300" y="206" font-size="12" style="fill:var(--q)">18時に1通</text>
  <text x="422" y="100" font-size="12" text-anchor="middle" style="fill:var(--mute)">いまは通知なし</text>
  <rect x="352" y="164" width="140" height="44" rx="6" style="fill:var(--q-soft);stroke:var(--q);stroke-width:1.5"/>
  <text x="364" y="184" font-size="13" font-weight="700" style="fill:var(--ink)">18:00 · 3件の更新</text>
  <text x="364" y="200" font-size="12" style="fill:var(--sub)">まとめて1通</text>
