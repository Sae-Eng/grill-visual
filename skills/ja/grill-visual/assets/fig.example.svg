  <path d="M292 127H346" style="fill:none;stroke:var(--accent);stroke-width:1.5" marker-end="url(#fx-accent)"/>
  <text x="318" y="119" font-size="12" text-anchor="middle" style="fill:var(--accent)">1通</text>
  <rect x="352" y="84" width="140" height="86" rx="6" style="fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5"/>
  <text x="364" y="106" font-size="13" font-weight="700" style="fill:var(--ink)">3件の更新</text>
  <text x="364" y="126" font-size="12" style="fill:var(--sub)">レビュー依頼・CI 失敗</text>
  <text x="364" y="143" font-size="12" style="fill:var(--sub)">・コメント</text>
  <text x="364" y="160" font-size="12" style="fill:var(--mute)">10:09</text>
</g>
<!-- B: 1件ずつ3通届く -->
<g data-layer="B">
  <path d="M160 67H346M160 127H346M160 187H346" style="fill:none;stroke:var(--accent);stroke-width:1.5" marker-end="url(#fx-accent)"/>
  <text x="252" y="60" font-size="12" text-anchor="middle" style="fill:var(--accent)">1通目</text>
  <text x="252" y="120" font-size="12" text-anchor="middle" style="fill:var(--accent)">2通目</text>
  <text x="252" y="180" font-size="12" text-anchor="middle" style="fill:var(--accent)">3通目</text>
  <g style="fill:var(--surface);stroke:var(--accent);stroke-width:1.5"><rect x="352" y="46" width="140" height="42" rx="6"/><rect x="352" y="106" width="140" height="42" rx="6"/><rect x="352" y="166" width="140" height="42" rx="6"/></g>
  <text x="364" y="72" font-size="13" font-weight="700" style="fill:var(--ink)">レビュー依頼</text>
