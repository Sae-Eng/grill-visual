<svg viewBox="0 0 520 262" role="img" aria-label="同じ3件の出来事が、A では1通にまとまり、B では3通に分かれて届き、C では18時まで待って1通で届く。">
<!-- 図の断片の例（references/data.md の「図の断片」）。下絵は1回だけ描き、案で変わる所だけを <g data-layer> にする。
     この図: 出来事の3枚・画面の枠・見出しが下絵。届き方（線・通知の札）が A・B・C の層。 -->
<defs><marker id="fx-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L8.5 5L1.5 8.5" style="fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round"/></marker><marker id="fx-q" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L8.5 5L1.5 8.5" style="fill:none;stroke:var(--q);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round"/></marker></defs>
<!-- 下絵 -->
<text x="20" y="28" font-size="12" font-weight="600" style="fill:var(--mute);font-family:var(--mono)">出来事（同じ3件）</text>
<g style="fill:var(--surface);stroke:var(--ink);stroke-width:1.5">
  <rect x="20" y="44" width="140" height="46" rx="4"/><rect x="20" y="104" width="140" height="46" rx="4"/><rect x="20" y="164" width="140" height="46" rx="4"/>
</g>
<text x="32" y="64" font-size="13" font-weight="700" style="fill:var(--ink)">PR のレビュー依頼</text><text x="32" y="81" font-size="12" style="fill:var(--sub)">10:02</text>
<text x="32" y="124" font-size="13" font-weight="700" style="fill:var(--ink)">CI の失敗</text><text x="32" y="141" font-size="12" style="fill:var(--sub)">10:05</text>
<text x="32" y="184" font-size="13" font-weight="700" style="fill:var(--ink)">コメント 1件</text><text x="32" y="201" font-size="12" style="fill:var(--sub)">10:09</text>
<rect x="340" y="20" width="164" height="214" rx="16" style="fill:var(--surface);stroke:var(--ink);stroke-width:1.5"/>
<rect x="398" y="28" width="48" height="6" rx="3" style="fill:var(--line)"/>
<text x="422" y="254" font-size="12" text-anchor="middle" style="fill:var(--sub)">あなたの画面</text>
<!-- A: 1通にまとめて届く -->
<g data-layer="A">
  <path d="M160 67C200 67 200 127 232 127M160 127H232M160 187C200 187 200 127 232 127" style="fill:none;stroke:var(--accent);stroke-width:1.5"/>
  <rect x="232" y="112" width="60" height="30" rx="4" style="fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5"/>
